server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE:Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    signed-key: ${SIGNED_KEY}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}
    sliding-session-ttl-seconds: ${JWT_SLIDING_SESSION_TTL_SECONDS:86400}
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:false}
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
    staff-id: ${SEED_ADMIN_STAFF_ID:SYS000001}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.attendance.auth: ${AUTH_LOG_LEVEL:INFO}
