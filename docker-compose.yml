networks:
  attendance-network:
    driver: bridge

volumes:
  mysql-auth-data:
  mysql-core-data:
  e2e-node-modules:

services:

  # ============================================================
  # DATABASE SERVICES
  # ============================================================

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?Set AUTH_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
      MYSQL_USER: ${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "${AUTH_DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-core:
    image: mysql:8.0
    container_name: mysql-core
    environment:
      MYSQL_ROOT_PASSWORD: ${CORE_DB_ROOT_PASSWORD:?Set CORE_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${CORE_DB_NAME:-core_db}
      MYSQL_USER: ${CORE_DB_USERNAME:?Set CORE_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}
    ports:
      - "${CORE_DB_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-core-data:/var/lib/mysql
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================

  eureka-service:
    build:
      context: ./eureka-service
      dockerfile: Dockerfile
    container_name: eureka-service
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      EUREKA_URL: ${EUREKA_URL:-http://eureka-service:8761/eureka/}
      SIGNED_KEY: ${SIGNED_KEY:?Set SIGNED_KEY in .env}
      AUTH_INTROSPECT_URL: ${AUTH_INTROSPECT_URL:-http://auth-service:8081/auth/introspect}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - attendance-network

  # ============================================================
  # BACKEND MICROSERVICES
  # ============================================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USERNAME: ${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-service:8761/eureka/}
      SIGNED_KEY: ${SIGNED_KEY:?Set SIGNED_KEY in .env}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-86400}
      JWT_SLIDING_SESSION_TTL_SECONDS: ${JWT_SLIDING_SESSION_TTL_SECONDS:-86400}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_ADMIN_STAFF_ID: ${SEED_ADMIN_STAFF_ID:-SYS000001}
      AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-INFO}
    depends_on:
      mysql-auth:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - attendance-network

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "${CORE_SERVICE_HOST_PORT:-8082}:8082"
    environment:
      DB_HOST: mysql-core
      DB_PORT: 3306
      DB_NAME: ${CORE_DB_NAME:-core_db}
      DB_USERNAME: ${CORE_DB_USERNAME:?Set CORE_DB_USERNAME in .env}
      DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      INTERNAL_JWT_SIGNED_KEY: ${INTERNAL_JWT_SIGNED_KEY:?Set INTERNAL_JWT_SIGNED_KEY in .env}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-ai-service}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE:-core-service}
      INTERNAL_JWT_REQUIRED_SCOPE: ${INTERNAL_JWT_REQUIRED_SCOPE:-attendance:sync}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-service:8761/eureka/}
      # No user login SIGNED_KEY here; core-service only verifies internal M2M JWT.
      CORE_LOG_LEVEL: ${CORE_LOG_LEVEL:-INFO}
    depends_on:
      mysql-core:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - attendance-network

  # ============================================================
  # FRONTEND SERVICE
  # ============================================================

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    environment:
      API_GATEWAY_URL: ${FRONTEND_API_GATEWAY_URL:-http://api-gateway:8080}
      NGINX_SERVER_NAME: ${FRONTEND_SERVER_NAME:-_}
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network

  # ============================================================
  # E2E TESTING SERVICE
  # ============================================================

  e2e-runner:
    image: mcr.microsoft.com/playwright:v1.51.1-noble
    working_dir: /app
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://frontend}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:?Set E2E_ADMIN_EMAIL in .env}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?Set E2E_ADMIN_PASSWORD in .env}
      E2E_USER_EMAIL: ${E2E_USER_EMAIL:-e2e_test_user@example.com}
      E2E_USER_DOB: ${E2E_USER_DOB:-1998-03-20}
      E2E_USER_PASSWORD: ${E2E_USER_PASSWORD:?Set E2E_USER_PASSWORD in .env}
      E2E_TTL_MODE: ${E2E_TTL_MODE:-false}
      E2E_SHORT_ACCESS_TTL_SECONDS: ${E2E_SHORT_ACCESS_TTL_SECONDS:-3}
      E2E_SHORT_SLIDING_SESSION_TTL_SECONDS: ${E2E_SHORT_SLIDING_SESSION_TTL_SECONDS:-9}
      E2E_CORE_INTERNAL_BASE_URL: ${E2E_CORE_INTERNAL_BASE_URL:-http://core-service:8082}
      INTERNAL_JWT_SIGNED_KEY: ${INTERNAL_JWT_SIGNED_KEY:?Set INTERNAL_JWT_SIGNED_KEY in .env}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-ai-service}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE:-core-service}
      INTERNAL_JWT_REQUIRED_SCOPE: ${INTERNAL_JWT_REQUIRED_SCOPE:-attendance:sync}
    volumes:
      - ./front-end:/app
      - e2e-node-modules:/app/node_modules
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - attendance-network
    entrypoint:
      - /bin/sh
      - -c
      - npm ci --legacy-peer-deps && npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.51.1 && npx playwright test
