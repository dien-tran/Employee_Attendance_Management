spring:
  datasource:
    url: jdbc:h2:mem:core_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  internal:
    jwt:
      signed-key: test-internal-signing-key-for-hs512-must-be-at-least-64-bytes-long
      issuer: ai-service
      audience: core-service
      required-scope: attendance:sync

logging:
  level:
    com.attendance.core: DEBUG
